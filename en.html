<script>
    document.addEventListener("DOMContentLoaded", function () {
        const menuLinks = document.querySelectorAll(".menu .sidebar-font");

        menuLinks.forEach((link) => {
            link.addEventListener("click", (event) => {
                const clickedItem = event.currentTarget;

                const icon = clickedItem.querySelector(".icon");
                const text = clickedItem.querySelector("span");

                menuLinks.forEach((otherLinks) =>{
                    otherLinks.querySelector(".icon").classList.remove("active-icon");
                    otherLinks.querySelector("span").classList.remove("active-text");
                });

                icon.classList.add("active-icon");
                text.classList.add("active-text");
                
            });
        });
    });
</script>
<script src="cursorAnimation.js"></script>
